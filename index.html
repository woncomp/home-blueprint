<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭强电设计器</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <div id="main">
    <div id="toolbar">
      <span class="title">家庭强电设计器</span>
      <div class="mode-switch">
        <button id="btn-view-mode" class="mode-btn active">查看模式</button>
        <button id="btn-edit-mode" class="mode-btn">电路编辑</button>
        <button id="btn-plan-mode" class="mode-btn">户型编辑</button>
      </div>
      <div id="edit-tools" class="hidden">
        <button id="btn-delete-entity" class="tool-btn danger" disabled>删除选中</button>
        <span id="edit-hint" class="hint"></span>
      </div>
      <div id="plan-tools" class="hidden">
        <button id="plan-tool-select" class="tool-btn active-tool">☝ 选择</button>
        <button id="plan-tool-ortho" class="tool-btn">📐 正交画墙</button>
        <button id="plan-tool-free" class="tool-btn">✏ 任意画墙</button>
        <button id="plan-tool-door" class="tool-btn">🚪 添加门</button>
        <button id="plan-tool-delete" class="tool-btn danger">✕ 删除墙</button>
        <button id="plan-fit" class="tool-btn">⛶ 适应视图</button>
        <span id="plan-hint" class="hint"></span>
      </div>
      <div class="spacer"></div>
      <label class="toolbar-check" title="勾选：房间文字平铺在房间地面上；取消：悬浮在房间上方、始终面向视角">
        <input type="checkbox" id="chk-room-label-floor" checked>
        房间文字贴地
      </label>
      <button id="btn-export" class="tool-btn">导出 JSON</button>
      <button id="btn-import" class="tool-btn">导入 JSON</button>
      <input type="file" id="file-input" accept=".json" class="hidden">
    </div>
    <div id="canvas-container">
      <canvas id="scene-canvas"></canvas>
      <svg id="plan-svg" class="hidden"></svg>
      <div id="overlay-hint">
        <span>WASD 平移视点 · 左键拖动旋转 · 滚轮缩放 · 点击选中</span>
      </div>
    </div>
  </div>
  <div id="sidebar">
    <div id="breaker-panel">
      <h3>强电箱</h3>
      <div id="breaker-list"></div>
    </div>
    <div id="entity-panel">
      <h3>信息</h3>
      <div id="entity-info">
        <p class="placeholder">点击 3D 场景中的电线、设备或端点查看详情</p>
      </div>
    </div>
  </div>
</div>
<div id="wallface-dialog" class="hidden">
  <div id="wallface-backdrop"></div>
  <div id="wallface-window">
    <div id="wallface-header">
      <span id="wallface-title">墙面展开</span>
      <div id="wallface-tools">
        <button class="wf-tool" data-wftool="select" title="选择/拖动">☝ 选择</button>
        <button class="wf-tool" data-wftool="wire" title="连接两个节点：支持当前墙与左右相邻墙的跨墙电线">➰ 连线</button>
        <button class="wf-tool" data-wftool="turn" title="转弯端点">↪ 转弯端点</button>
        <button class="wf-tool" data-wftool="split" title="分线端点">⑃ 分线端点</button>
        <button class="wf-tool" data-wftool="socket" title="插座">⏚ 插座</button>
        <button class="wf-tool" data-wftool="switch" title="开关">◻ 开关</button>
        <button class="wf-tool" data-wftool="light" title="灯具">☀ 灯具</button>
        <button class="wf-tool" data-wftool="remove" title="删除节点">✕ 删除</button>
        <button class="wf-tool" data-wftool="link" title="同一位置两面墙体的就近连通（0.4m 内），区别于跨墙电线">⇄ 穿墙连通</button>
      </div>
      <div class="spacer"></div>
      <button id="wallface-close">关闭 ✕</button>
    </div>
    <div id="wallface-body">
      <div id="wallface-scroll">
        <svg id="wallface-svg"></svg>
      </div>
      <div id="wallface-side">
        <div id="wallface-info"></div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
